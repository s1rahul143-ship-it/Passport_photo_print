<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Passport Photo Print</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Passport Photo Print</h1>

    <section class="controls">
      <label class="file-label">
        Upload photo (JPG, PNG)
        <input id="photoInput" type="file" accept="image/jpeg,image/png">
      </label>

      <label>
        Photo size
        <select id="sizeSelect">
          <option value="35x45">35 × 45 mm (common)</option>
          <option value="40x50">40 × 50 mm</option>
          <option value="51x51">51 × 51 mm (2 × 2 in)</option>
          <option value="custom">Custom</option>
        </select>
      </label>

      <div id="customSizeInputs" style="display:none">
        <label>
          Width (mm)
          <input id="customW" type="number" min="1" value="35">
        </label>
        <label>
          Height (mm)
          <input id="customH" type="number" min="1" value="45">
        </label>
        <button id="applyCustomSize">Apply size</button>
      </div>

      <label>
        Background color
        <select id="backgroundSelect">
          <option value="#ffffff">White (none)</option>
          <option value="#dfffe0">Light green</option>
          <option value="#e6f0ff">Light blue</option>
          <option value="#ffe6f0">Light pink</option>
          <option value="#001f3f">Navy blue</option>
          <option value="#cccccc">Gray</option>
        </select>
      </label>

      <label>
        Number of copies (1–60)
        <input id="copiesInput" type="number" min="1" max="60" value="10">
      </label>

      <div class="buttons">
        <button id="generateBtn" disabled>Generate A4 Layout</button>
        <button id="printBtn" disabled>Print</button>
      </div>

      <p class="note">You can crop the uploaded photo and select a background color. The app arranges images on A4 pages (210mm × 297mm). Works offline.</p>
    </section>

    <section id="previewArea" class="preview">
      <!-- Generated A4 page(s) will appear here -->
    </section>

    <footer>
      <small>Made for quick passport printing — no uploads to servers, everything runs in your browser.</small>
    </footer>
  </main>

  <!-- Crop modal (hidden until an image is uploaded) -->
  <div id="cropModal" class="crop-modal" style="display:none">
    <div class="crop-container">
      <div id="cropViewport" class="crop-viewport">
        <img id="cropImg" src="" alt="to crop">
      </div>

      <div class="crop-controls">
        <label>Zoom <input id="zoomRange" type="range" min="50" max="200" value="100"></label>
        <div class="crop-buttons">
          <button id="applyCrop">Apply crop</button>
          <button id="cancelCrop">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
